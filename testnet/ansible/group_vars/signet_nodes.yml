---
# Group variables for all signet nodes.
# Per-node variables (peer_id, eth_address, etc.) are set in host_vars/
# after running devnet-init and the deploy script.

node_type: public
log_level: debug

# --- Host layout ---
#
# These were previously defined only in inventory.yml, which is gitignored for
# its IPs — so they were lost with it and nothing in the repo could rebuild a
# working deploy. None of them are secret. The inventory now carries hosts and
# IPs and nothing else.
#
# Values match the deployed testnet layout: REDEPLOY.md §4 backs up
# /opt/signet/data and /opt/signet/kms-data, the unit sets HOME=/opt/signet,
# and the security groups open 9000 (libp2p) and 8080 (HTTP API).
signetd_user: signet
signetd_bin: /usr/local/bin/signetd
signetd_config_dir: /etc/signet
signetd_data_dir: /opt/signet/data
signetd_log_dir: /var/log/signet
p2p_port: 9000
api_port: 8080

# --- TLS on the HTTP API ---
#
# The /v1 API carries session credentials, EIP-712 payloads and returned
# signatures. Most sharply, a delegation token is a bearer credential: /v1/auth
# binds the session to whatever session_pub the caller supplies, so a token seen
# in flight can be replayed by anyone. Caddy terminates TLS on 443 and proxies
# to signetd on loopback.
#
# The inter-node path on p2p_port needs nothing — libp2p already uses TLS 1.3 /
# Noise with peer-ID authentication.
use_tls: true

# ACME account contact. Required when use_tls is true.
tls_email: ""

# Staging endpoint while testing. Let's Encrypt production rate limits are per
# registered domain and easy to exhaust across six nodes and repeated
# wipe-and-redeploy cycles. Unset for production certificates.
# acme_ca: "https://acme-staging-v02.api.letsencrypt.org/directory"

# Who may reach /debug/*. It is unauthenticated and reports group membership
# and per-peer health, so it is loopback-only unless you widen this.
debug_allow_cidrs:
  - 127.0.0.1/32

# Bind address for signetd's own listener. With TLS on it MUST be loopback:
# left on all interfaces, port 8080 stays directly reachable and the TLS
# termination is simply bypassable.
api_bind: "{{ '127.0.0.1' if use_tls | bool else '' }}"

# --- Rate limiting (audit M2 / R-6) ---
#
# Needs a Caddy built with github.com/mholt/caddy-ratelimit — stock Caddy does
# not know the directive. Build once per release:
#   GOOS=linux GOARCH=amd64 xcaddy build \
#     --with github.com/mholt/caddy-ratelimit --output build/caddy-linux-amd64
use_rate_limit: true
local_caddy_binary_path: "../../../../build/caddy-linux-amd64"

# Per client IP, per window. /v1/auth is tightest because it shells out to
# `bb verify` and then broadcasts to every member — the most expensive thing an
# unauthenticated caller can trigger. /v1/sign is the payment hot path and stays
# generous. /v1/health and /v1/info are not limited at all.
rate_limit_window: "1m"
rate_limit_auth_events: 10
rate_limit_keygen_events: 10
rate_limit_sign_events: 120
rate_limit_delegate_events: 30
rate_limit_keys_events: 30
rate_limit_admin_events: 60

# Addresses exempt from every zone. The perf harness drives sustained load from
# a single source and WILL trip the limits above — put the runner's address here
# rather than loosening the limits for the whole internet.
rate_limit_exempt_cidrs: []

# Secrets dir, kept separate from signetd_config_dir so its 0750 root:signet
# perms do not fight the 0755 signet:signet the config dir wants.
signet_secrets_dir: /etc/signet/secrets
signetd_env_file: "{{ signet_secrets_dir }}/signetd.env"

# KMS configuration
use_kms: true
kms_bin: /usr/local/bin/kms-tss
kms_socket: /run/signet/kms.sock
kms_data_dir: /opt/signet/kms-data

# --- KMS at-rest encryption ---
#
# kms-tss encrypts the sled store when SIGNET_KMS_KEY is present in its
# environment, and runs plaintext when it is absent (src/main.rs:97). There is
# NO migration path in either direction — flipping this on or off against a
# populated store makes the existing shards unreadable. Decide before the first
# keygen; changing it later means a wipe.
#
# The per-node KEK itself lives in host_vars as `kms_kek` (64 hex chars) and is
# generated by testnet/scripts/init-alpha.sh. Keep host_vars ansible-vaulted.
kms_at_rest_encryption: true
kms_env_file: "{{ signet_secrets_dir }}/kms.env"

# Barretenberg version — read from signet-circuits/toolchain.json at deploy time.
# See roles/bb/tasks/main.yml for how this is resolved.

# Chain event poll interval. Every tick costs one eth_blockNumber plus one
# eth_getLogs regardless of group count, so this is the standing RPC spend of an
# idle node. The events polled for are all operator-initiated and rare.
chain_poll_secs: 60

# --- On-chain auth resolver (onchain_resolver scheme) ---
#
# Both are unset by default, which leaves the scheme disabled. The node rejects
# onchain_resolver outright when siwe_domain is empty, so enabling the scheme
# means setting this to the exact ERC-4361 domain clients sign against.
#
# siwe_domain: "testnet.signet.example"
#
# Only needed if a group's resolver lives on a chain other than eth_rpc's.
# chain_rpcs:
#   8453: "https://base-mainnet.example/v2/KEY"
